services:
  # Python 3.8 tests
  test-py38:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.8"
    image: jetq-test:py38
    container_name: jetq-test-py38
    volumes:
      - .:/app
    command: pytest -v --tb=short
    environment:
      - PYTHON_VERSION=3.8

